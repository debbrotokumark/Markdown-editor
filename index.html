<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Markdown Toolkit · Word-style Editor</title>

  <!-- Quill (WYSIWYG Editor) -->
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet"/>

  <style>
    *{box-sizing:border-box;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{background:#f4f6fb;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
    .main{max-width:1300px;width:100%;background:#fff;border-radius:2rem;box-shadow:0 20px 40px -12px rgba(0,10,30,.25);overflow:hidden;border:1px solid rgba(255,255,255,.5)}
    .header{padding:1.8rem 2.2rem 1rem}
    .header h1{font-size:2rem;font-weight:650;letter-spacing:-.02em;display:flex;gap:12px;align-items:center}
    .badge{background:#eef2fa;padding:.25rem 1rem;border-radius:999px;font-size:.9rem}
    .header p{color:#4a5a72;margin-top:8px}

    .content{display:flex;flex-wrap:wrap}
    .left,.right{flex:1 1 450px;padding:1.6rem 2rem 2rem;min-height:520px}
    .left{border-right:1px solid #e6edf6}
    .label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.8rem}
    .label h3{font-size:.95rem;letter-spacing:.4px;text-transform:uppercase;color:#334155;font-weight:600}
    .pill{font-size:.8rem;background:#edf2f9;padding:.25rem .8rem;border-radius:999px;color:#2c3e5c}

    /* Quill editor look like a document */
    #editorWrap{border:2px solid #e9eef4;border-radius:22px;overflow:hidden;background:#fff}
    #editor{height:420px}
    .ql-toolbar.ql-snow{border:none;border-bottom:2px solid #e9eef4;border-radius:22px 22px 0 0}
    .ql-container.ql-snow{border:none;border-radius:0 0 22px 22px}
    .ql-editor{padding:20px;font-size:16px;line-height:1.65}
    .ql-editor.ql-blank::before{color:#94a3b8}

    .preview{background:#f9fcff;border-radius:22px;padding:1.2rem;border:2px solid #e9eef4;min-height:420px;max-height:520px;overflow:auto;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;white-space:pre-wrap}

    .footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;
      padding:1.2rem 2rem 2rem;border-top:1px solid #e2e8f0}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    .primary{background:#1e2f44;color:#fff;border:1px solid #162434;padding:.8rem 1.6rem;border-radius:999px;
      font-weight:700;cursor:pointer}
    .secondary{background:#fff;color:#1f2e44;border:1.5px solid #c0ccde;padding:.8rem 1.6rem;border-radius:999px;
      font-weight:650;cursor:pointer}
    .hint{color:#5f6f88;font-size:.95rem;display:flex;gap:10px;align-items:center}
    .link{color:#1e3a5f;font-weight:700;text-decoration:none;border-bottom:1px dashed #a7bbd4;cursor:pointer}
  </style>
</head>
<body>
  <div class="main">
    <div class="header">
      <h1>📓 .md creator <span class="badge">Word-style · Markdown Export</span></h1>
      <p>Type like MS Word → export/download as Markdown (.md)</p>
    </div>

    <div class="content">
      <div class="left">
        <div class="label">
          <h3>✍️ Editor (Word style)</h3>
          <span class="pill" id="charCount">0 chars</span>
        </div>

        <div id="editorWrap">
          <div id="toolbar"></div>
          <div id="editor"></div>
        </div>
      </div>

      <div class="right">
        <div class="label">
          <h3>🧾 Markdown Output</h3>
          <span class="pill" id="lineCount">0 lines</span>
        </div>
        <div class="preview" id="mdOut">Click “Export to Markdown”</div>
      </div>
    </div>

    <div class="footer">
      <div class="actions">
        <button class="primary" id="exportBtn">📄 Export to Markdown</button>
        <button class="secondary" id="downloadBtn">⬇️ Download .md</button>
        <button class="secondary" id="clearBtn">🧹 Clear</button>
      </div>
      <div class="hint">
        <span>✨ Word-like editor</span>
        <span class="link" id="sampleBtn">insert sample</span>
      </div>
    </div>
  </div>

  <!-- Quill -->
  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <!-- Turndown: HTML -> Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.js"></script>

  <script>
    // Quill toolbar (Word-ish)
    const toolbarOptions = [
      [{ header: [1, 2, 3, false] }],
      ["bold", "italic", "underline", "strike"],
      [{ list: "ordered" }, { list: "bullet" }],
      ["blockquote", "code-block"],
      ["link"],
      [{ align: [] }],
      ["clean"]
    ];

    const quill = new Quill("#editor", {
      theme: "snow",
      modules: { toolbar: toolbarOptions },
      placeholder: "Start writing… (like MS Word)"
    });

    const charCount = document.getElementById("charCount");
    const lineCount = document.getElementById("lineCount");
    const mdOut = document.getElementById("mdOut");

    const turndownService = new TurndownService({
      headingStyle: "atx",
      codeBlockStyle: "fenced",
      bulletListMarker: "-"
    });

    function updateCounts() {
      const text = quill.getText().trimEnd();
      charCount.textContent = text.length + " chars";
    }

    quill.on("text-change", updateCounts);
    updateCounts();

    function exportMarkdown() {
      const html = quill.root.innerHTML;
      const md = turndownService.turndown(html).trim() || "";
      mdOut.textContent = md || "⚠️ Nothing to export yet.";
      const lines = md ? md.split("\n").length : 0;
      lineCount.textContent = lines + " lines";
      return md;
    }

    function downloadMd() {
      const md = exportMarkdown();
      if (!md) return;

      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "document.md";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    document.getElementById("exportBtn").addEventListener("click", exportMarkdown);
    document.getElementById("downloadBtn").addEventListener("click", downloadMd);

    document.getElementById("clearBtn").addEventListener("click", () => {
      if (confirm("Clear everything?")) {
        quill.setText("");
        mdOut.textContent = "Click “Export to Markdown”";
        lineCount.textContent = "0 lines";
        updateCounts();
      }
    });

    document.getElementById("sampleBtn").addEventListener("click", () => {
      quill.setContents([
        { insert: "Markdown Toolkit\n", attributes: { header: 1 } },
        { insert: "Write like Word, export to Markdown.\n\n" },
        { insert: "Features:\n", attributes: { bold: true } },
        { insert: "• Bold / Italic / Underline\n• Headings\n• Lists\n• Quotes\n\n" },
        { insert: "Quote example\n", attributes: { blockquote: true } }
      ]);
      updateCounts();
    });
  </script>
</body>
</html>
